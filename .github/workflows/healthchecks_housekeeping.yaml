name: "🩺 Healthchecks & Housekeeping 🧹"

#MARK: TRIGGER
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/**"
  schedule:
    - cron: "30 6 * * 1"

# Metadata generation used to live here and in the build workflow at the same
# time -- download_url was minted here and enriched there, twelve hours apart,
# with two workflows co-owning one field. The build's finalize job now owns
# METADATA.json outright. This workflow does lint and health only, and reads
# the committed metadata rather than a remote bucket.

env:
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

concurrency:
  group: "healthchecks-${{ github.ref }}"
  cancel-in-progress: true

jobs:

#MARK: LINT
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: "blob:none"

      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq shellcheck yamllint dos2unix
          # actionlint ships a static binary upstream
          bash <(curl -qfsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo install -m 755 ./actionlint /usr/local/bin/actionlint

      - name: ActionLint
        run: |
          set -uo pipefail
          rc=0
          for f in .github/workflows/*.y*ml; do
            actionlint "$f" || rc=1
          done
          exit "$rc"

      - name: Shellcheck
        run: |
          set -uo pipefail
          rc=0
          # Only our own scripts. The 900+ recipes under bins/ are upstream
          # and are linted separately, not gated on.
          for f in .github/scripts/x86_64_Linux/*.sh .github/scripts/x86_64_Linux/prebuilts/*.sh; do
            [ -f "$f" ] || continue
            shellcheck --exclude=SC2261 --severity=error "$f" || rc=1
          done
          exit "$rc"

      - name: Recipe yaml sanity
        run: |
          set -uo pipefail
          # Every allowlisted recipe must have a yaml that declares at least
          # one binary -- an empty bins: list makes the "partial" detection
          # in the build loop meaningless for that recipe.
          rc=0
          while IFS= read -r r; do
            y=".github/scripts/x86_64_Linux/bins/${r}.yaml"
            if [ ! -f "$y" ]; then echo "::error::missing ${y}"; rc=1; continue; fi
            if ! grep -q '^bins:' "$y"; then echo "::error::${r}.yaml has no bins:"; rc=1; fi
          done < .github/scripts/x86_64_Linux/RECIPES.txt
          exit "$rc"

#MARK: GENERATORS STILL AGREE
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: "blob:none"

      - name: Allowlist, installers and prebuilts are current
        run: |
          set -euo pipefail
          cd .github/scripts/x86_64_Linux
          ./gen_recipes.sh --check
          ./gen_installers.sh --check
          ./prebuilts/fetch.sh --verify

      - name: No external binary cache has crept back in
        run: |
          set -uo pipefail
          # The blackhole job in the build workflow is the real proof, since
          # it also catches URLs built at runtime. This is the cheap static
          # half: nothing in our own scripts or workflows may name a
          # third-party binary cache.
          if grep -rnE 'ajam\.dev|bin\.pkgforge\.dev' \
               .github/workflows .github/scripts/x86_64_Linux/*.sh \
               | grep -v 'blackhole\|127\.0\.0\.1\|crept back in' ; then
            echo "::error::a third-party binary cache is referenced again"
            exit 1
          fi
          echo "::notice::no third-party cache references"

      - name: Toolchain trim still holds
        run: |
          set -uo pipefail
          # Crystal, Node, Zig, Nuitka, Pex and PyInstaller were removed from
          # init_debian.sh because zero in-scope recipes used them. If a new
          # recipe needs one, this fails loudly instead of at build time.
          rc=0
          while IFS= read -r r; do
            f=".github/scripts/x86_64_Linux/bins/${r}.sh"
            [ -f "$f" ] || continue
            if grep -qE '(^|[^a-z])(crystal|shards|nuitka|pyinstaller)([^a-z]|$)|npm |yarn |zig build' "$f"; then
              echo "::error::${r}.sh needs a toolchain that init_debian.sh no longer installs"
              rc=1
            fi
          done < .github/scripts/x86_64_Linux/RECIPES.txt
          exit "$rc"

#MARK: HEALTH (reads committed metadata, not a bucket)
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tooling from vendored prebuilts
        run: |
          set -euo pipefail
          cd .github/scripts/x86_64_Linux/prebuilts
          for b in jq yq; do sudo install -m 755 "./${b}" "/usr/local/bin/${b}"; done

      - name: Duplicate binary names across families
        run: |
          set -uo pipefail
          cd .github/scripts/x86_64_Linux/bins
          # Two recipes producing the same binary name means whichever runs
          # last silently wins in $BINDIR.
          while IFS= read -r r; do
            yq -r '.bins[]?' "${r}.yaml" 2>/dev/null
          done < ../RECIPES.txt | sort | uniq -d > "${RUNNER_TEMP}/dupes.txt"
          if [ -s "${RUNNER_TEMP}/dupes.txt" ]; then
            echo "### Duplicate binaries" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r d; do
              owners="$(grep -l "\"${d}\"\|- ${d}$" ./*.yaml 2>/dev/null | xargs -r -n1 basename | paste -sd, -)"
              echo "- \`${d}\` <- ${owners}" >> "$GITHUB_STEP_SUMMARY"
            done < "${RUNNER_TEMP}/dupes.txt"
            echo "::warning::$(wc -l < "${RUNNER_TEMP}/dupes.txt") duplicate binary name(s)"
          else
            echo "::notice::no duplicate binary names"
          fi

      - name: Metadata integrity
        run: |
          set -uo pipefail
          M="x86_64-Linux/METADATA.json"
          if [ ! -s "$M" ]; then
            echo "::notice::no committed metadata yet"; exit 0
          fi
          # Same gate the generator applies, re-checked against what actually
          # landed in the repo.
          EMPTY="$(jq '[.[] | if type=="array" then .[] else . end
                       | select(.b3sum=="" or .sha256=="" or .download_url=="" or .pkg_family=="")]
                       | length' "$M")"
          TOTAL="$(jq '[.[] | if type=="array" then .[] else . end] | length' "$M")"
          echo "::notice::${TOTAL} entries, ${EMPTY} with empty required fields"
          if [ "$EMPTY" -ne 0 ]; then
            echo "::error::${EMPTY} metadata entries have empty required fields"
            exit 1
          fi
