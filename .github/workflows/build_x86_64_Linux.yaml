name: "🐧 Build x86_64-Linux 🐧"

#MARK: TRIGGER
on:
  workflow_dispatch:
  schedule:
    # Monthly. The old weekly cadence existed because R2 was cheap to
    # overwrite; at ~1.2h of build for 133 recipes, monthly is plenty.
    - cron: "30 18 1 * *"

#MARK: ENV
env:
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GHCR_NAMESPACE: "toolpacks"
  # "org" or "user" -- decides which GitHub API path sets package visibility.
  GHCR_OWNER_TYPE: "user"

concurrency:
  group: "build-x86_64-${{ github.ref }}"
  cancel-in-progress: false

jobs:

#MARK: PREPARE
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      recipe_count: "${{ steps.check.outputs.recipe_count }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: "blob:none"

      - name: Validate allowlist and prebuilts
        id: check
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.github/scripts/x86_64_Linux"
          # Regenerating from the upstream installers proves the allowlist
          # still matches what they actually ask for.
          ./gen_recipes.sh --check
          # Installers bake the hosting owner as default; generate the
          # check with this repo's owner so forks check against themselves.
          GHCR_OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" ./gen_installers.sh --check
          ./prebuilts/fetch.sh --verify
          N="$(wc -l < RECIPES.txt)"
          echo "recipe_count=${N}" >> "$GITHUB_OUTPUT"
          echo "### Prepare" >> "$GITHUB_STEP_SUMMARY"
          echo "- recipes: \`${N}\`" >> "$GITHUB_STEP_SUMMARY"

#MARK: SMOKE (permanent guard against reintroducing an external cache)
  smoke:
    runs-on: ubuntu-latest
    needs: [prepare]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: "blob:none"

      - name: Blackhole every external binary cache
        run: |
          # A grep cannot see URLs built at runtime, and several recipes
          # construct them. Resolving these hosts to localhost is the only
          # check that actually proves the dependency is gone.
          echo "127.0.0.1 pub.ajam.dev bin.ajam.dev pkg.ajam.dev bin.pkgforge.dev" \
            | sudo tee -a /etc/hosts
          echo "::notice::external caches blackholed"

      - name: Init + one fast recipe + one container recipe
        env:
          GHCR_PUSH: "NO"
        run: |
          set -uo pipefail
          cd "${GITHUB_WORKSPACE}/.github/scripts/x86_64_Linux"
          START="$(date +%s)"
          bash ./init_debian.sh
          echo "::notice::init_debian.sh took $(( $(date +%s) - START ))s"
          # Recipes sanity-check the same env build_debian.sh sets (its ENV
          # block). Without it every recipe exits 1 with "[+]Skipping
          # Builds..." and the smoke test proves nothing. Keep in sync.
          export SYSTMP="${RUNNER_TEMP}"
          export BINDIR="${RUNNER_TEMP}/bins" && mkdir -p "$BINDIR"
          export BUILD="YES"
          export EGET_TIMEOUT="timeout -k 1m 2m"
          export EGET_EXCLUDE="--asset \"^386\" --asset \"^aarch64\" --asset \"^apple\" --asset \"^arm\" --asset \"^AppImage\" --asset \"^asc\" --asset \"^crt\" --asset \"^darwin\" --asset \"^deb\" --asset \"^exe\" --asset \"^freebsd\" --asset \"^i686\" --asset \"^mac\" --asset \"^mips\" --asset \"^rpm\" --asset \"^pem\" --asset \"^sbom\" --asset \"^sha\" --asset \"^solaris\" --asset \"^sig\" --asset \"^symbol\" --asset \"^windows\""
          export GIT_TERMINAL_PROMPT="0"
          export GIT_ASKPASS="/bin/echo"
          export TMPDIRS="mktemp -d --tmpdir=$SYSTMP/toolpacks XXXXXXX_linux_x86_64"
          mkdir -p "$SYSTMP/toolpacks"
          # 7z is a ~1s eget fetch; chafa exercises the alpine-builder path.
          FAIL=0
          for r in 7z chafa; do
            ( timeout -k 60 20m bash -c "source ./bins/${r}.sh" ) || \
              { echo "::error::smoke recipe ${r} failed with no external cache"; FAIL=1; }
          done
          ls -la "$BINDIR"
          exit "$FAIL"

#MARK: BUILD
  build:
    runs-on: ubuntu-latest
    needs: [prepare]
    # ~1.2h serial for 133 recipes; 300 keeps margin under the 360 cap.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - name: Debloat runner
        run: |
          sudo rm -rf "/usr/local/lib/android" "/usr/share/dotnet" "/opt/ghc" \
                      "/usr/local/share/boost" "/usr/share/swift" \
                      "/opt/hostedtoolcache" 2>/dev/null || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: "blob:none"

      - name: BUILD
        env:
          GHCR_PUSH: "YES"
        run: |
          set -uo pipefail
          # SYSTMP must be RUNNER_TEMP: build_debian.sh writes RESULT.jsonl
          # to $SYSTMP, and only RUNNER_TEMP survives the job via artifacts
          # (a run once went green with zero results because it went to /tmp).
          export SYSTMP="${RUNNER_TEMP}"
          bash "${GITHUB_WORKSPACE}/.github/scripts/x86_64_Linux/build_debian.sh" \
            2>&1 | tee "${RUNNER_TEMP}/BUILD.log.txt"
          BUILD_RC="${PIPESTATUS[0]}"
          echo "BUILD_RC=${BUILD_RC}" >> "$GITHUB_ENV"
          # Stage one tarball so the artifact layout is deterministic:
          # {BUILD.log.txt,RESULT.jsonl,logs/*.log.txt}. The 10 MB monolith
          # stays artifact-only; per-recipe logs are committed by finalize.
          mkdir -p "${RUNNER_TEMP}/out/logs"
          cp -f "${RUNNER_TEMP}/BUILD.log.txt" "${RUNNER_TEMP}/out/" 2>/dev/null || true
          cp -f "${RUNNER_TEMP}/RESULT.jsonl" "${RUNNER_TEMP}/out/" 2>/dev/null || true
          cp -f "${GITHUB_WORKSPACE}/x86_64-Linux/logs/"*.log.txt "${RUNNER_TEMP}/out/logs/" 2>/dev/null || true
          tar -czf "${RUNNER_TEMP}/x86_64-output.tar.gz" -C "${RUNNER_TEMP}/out" .
          exit "$BUILD_RC"

      - name: Redact secrets from logs
        if: always()
        run: |
          for p in 'github_pat' 'ghp_' 'access_key_id' 'secret_access_key' 'Bearer '; do
            sed -i "/.*${p}.*/Id" "${RUNNER_TEMP}/BUILD.log.txt" 2>/dev/null || true
          done

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "x86_64-Linux-build"
          path: |
            ${{ runner.temp }}/x86_64-output.tar.gz
          retention-days: 30
          if-no-files-found: warn

#MARK: FINALIZE
  finalize:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: "blob:none"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: "x86_64-Linux-build"
          path: "${{ runner.temp }}/artifacts"
        continue-on-error: true

      - name: Extract build output
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/build-out"
          T="${RUNNER_TEMP}/artifacts/x86_64-output.tar.gz"
          if [ -s "$T" ]; then
            tar -xzf "$T" -C "${RUNNER_TEMP}/build-out"
            ls "${RUNNER_TEMP}/build-out"
          else
            echo "::error::build output tarball missing -- nothing to enforce or publish"
            exit 1
          fi

      - name: Install tooling from vendored prebuilts
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.github/scripts/x86_64_Linux/prebuilts"
          ./fetch.sh --verify
          for b in jq yq oras b3sum; do sudo install -m 755 "./${b}" "/usr/local/bin/${b}"; done

      - name: Enforce build results
        run: |
          set -uo pipefail
          R="${RUNNER_TEMP}/build-out/RESULT.jsonl"
          if [ ! -s "$R" ]; then
            echo "::error::no RESULT.jsonl -- the build died before writing any results"
            exit 1
          fi
          TOTAL="$(wc -l < "$R")"
          count() { grep -c "\"status\":\"$1\"" "$R" || true; }
          OK="$(count ok)"; PARTIAL="$(count partial)"
          FAIL="$(count fail)"; TIMEOUT="$(count timeout)"; MISSING="$(count missing)"
          BAD=$(( FAIL + TIMEOUT + MISSING ))
          {
            echo "### Build results"
            echo ""
            echo "| status | count |"
            echo "|---|---|"
            echo "| ok | ${OK} |"
            echo "| partial | ${PARTIAL} |"
            echo "| fail | ${FAIL} |"
            echo "| timeout | ${TIMEOUT} |"
            echo "| missing | ${MISSING} |"
            echo "| **total** | **${TOTAL}** |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt 0 ]; then
            echo ""; echo "#### Not ok" >> "$GITHUB_STEP_SUMMARY"
            grep -v '"status":"ok"' "$R" \
              | sed -E 's/.*"recipe":"([^"]*)".*"status":"([^"]*)".*/- `\1` -> \2/' \
              | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          # A shard-free build has no excuse for losing >10% of the catalogue.
          LIMIT=$(( TOTAL / 10 ))
          if [ "$BAD" -gt "$LIMIT" ]; then
            echo "::error::${BAD} of ${TOTAL} recipes failed (limit ${LIMIT})"
            exit 1
          fi
          echo "::notice::${OK} ok, ${PARTIAL} partial, ${BAD} failed of ${TOTAL}"

      - name: Regenerate metadata from GHCR
        run: |
          set -uo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/x86_64_Linux/gen_meta.sh"

      - name: Verify packages are pullable ANONYMOUSLY
        run: |
          set -uo pipefail
          # The check that catches private-by-default: a workflow-token push
          # creates packages private regardless of repo visibility, which
          # yields a green build and a cache nobody can read.
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SAMPLE="$(shuf -n 3 "${GITHUB_WORKSPACE}/.github/scripts/x86_64_Linux/RECIPES.txt")"
          rc=0
          for fam in $SAMPLE; do
            T="$(curl -qfsSL "https://ghcr.io/token?scope=repository:${OWNER}/${GHCR_NAMESPACE}/${fam}:pull&service=ghcr.io" \
                 | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
            if [ -z "$T" ]; then echo "::error::${fam}: no anonymous token"; rc=1; continue; fi
            if curl -qfsSL -o /dev/null -H "Authorization: Bearer ${T}" \
                 -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                 "https://ghcr.io/v2/${OWNER}/${GHCR_NAMESPACE}/${fam}/manifests/latest"; then
              echo "::notice::${fam}: anonymous pull OK"
            else
              echo "::error::${fam}: NOT publicly pullable"; rc=1
            fi
          done
          exit "$rc"

      - name: Commit metadata and logs
        run: |
          set -uo pipefail
          cd "${GITHUB_WORKSPACE}"
          mkdir -p x86_64-Linux/logs
          cp -f "${RUNNER_TEMP}/build-out/RESULT.jsonl" x86_64-Linux/ 2>/dev/null || true
          cp -f "${RUNNER_TEMP}/build-out/logs/"*.log.txt x86_64-Linux/logs/ 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A x86_64-Linux
          if git diff --cached --quiet; then
            echo "::notice::no metadata changes"
          else
            git commit -m "chore: refresh x86_64-Linux metadata ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Staleness gate
        run: |
          set -uo pipefail
          F="${GITHUB_WORKSPACE}/x86_64-Linux/BUILD_DATES.txt"
          [ -s "$F" ] || { echo "::notice::no BUILD_DATES.txt yet"; exit 0; }
          CUT="$(date -d '45 days ago' +%Y-%m-%d)"
          STALE="$(awk -v c="$CUT" '$1 < c' "$F" | wc -l)"
          echo "::notice::${STALE} tools older than ${CUT}"
          # The old pipeline reported success while ~250 tools silently went
          # stale for months. This is the check that would have caught it.
          if [ "$STALE" -gt 15 ]; then
            echo "::error::${STALE} stale tools (limit 15)"
            exit 1
          fi
